# native-access flags to disable noisy JDK 24 warnings
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

org.gradle.caching=true
# https://youtrack.jetbrains.com/issue/KT-55701
org.gradle.configureondemand=false
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Toe-hold for testing different versions
#org.jetbrains.kotlin.compiler.plugin.devkit.defaultTestVersion=

# Android
android.newDsl=true
android.builtInKotlin=true
android.disallowKotlinSourceSets=true

# If something goes wrong with IC, crash hard rather than silently failing
kotlin.daemon.useFallbackStrategy=false

kotlin.mpp.stability.nowarn=true
kotlin.apple.xcodeCompatibility.nowarn=true
kotlin.suppressGradlePluginWarnings=IncorrectCompileOnlyDependencyWarning

kotlin.native.enableKlibsCrossCompilation=true
kotlin.native.ignoreDisabledTargets=true

# https://youtrack.jetbrains.com/issue/KT-78504
kotlin.js.yarn=false

kotlin.compiler.suppressExperimentalICOptimizationsWarning=true
org.jetbrains.compose.experimental.macos.enabled=true

# AndroidX flags
android.useAndroidX=true

GROUP=dev.zacsweers.metro
VERSION_NAME=1.5.0-SNAPSHOT
# Version of the Metro compiler plugin used to bootstrap compiling the compiler with Metro itself
METRO_BOOTSTRAP_VERSION=1.4.0
POM_DESCRIPTION=A multiplatform, compile-time injection framework for Kotlin.
POM_URL=https://github.com/ZacSweers/metro/
POM_SCM_URL=https://github.com/ZacSweers/metro/
POM_SCM_CONNECTION=scm:git:git://github.com/ZacSweers/metro.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/ZacSweers/metro.git
POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo
POM_DEVELOPER_ID=zacsweers
POM_DEVELOPER_NAME=Zac Sweers
POM_DEVELOPER_URL=https://zacsweers.dev
SONATYPE_STAGING_PROFILE=dev.zacsweers
RELEASE_SIGNING_ENABLED=true

# Disable Kotlin FUS (Feature Usage Statistics) to fix configuration cache issue
# See: https://youtrack.jetbrains.com/issue/KT-69078/Gradle-Add-option-to-disable-FUS-Service
kotlin.internal.collectFUSMetrics=false

org.jetbrains.kotlin.compiler.plugin.devkit.minCliVersion=2.3.20
org.jetbrains.kotlin.compiler.plugin.devkit.includeBetaAndRc=latest
org.jetbrains.kotlin.compiler.plugin.devkit.minIdeaVersion=261
org.jetbrains.kotlin.compiler.plugin.devkit.includeIdeaRc=true
org.jetbrains.kotlin.compiler.plugin.devkit.includeIdeaEap=true
org.jetbrains.kotlin.compiler.plugin.devkit.useLatestDev=true
org.jetbrains.kotlin.compiler.plugin.devkit.pluginPackage = dev.zacsweers.metro.compiler