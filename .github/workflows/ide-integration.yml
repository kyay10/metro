name: IDE Integration Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      ide:
        description: 'IDE test task to run (e.g., "ideaUltimate2026_1_1IdeTest") or "all"'
        type: string
        default: 'all'

concurrency:
  group: 'ide-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  generate-matrix:
    name: Generate IDE matrix
    runs-on: ubuntu-latest
    outputs:
      ide-matrix: ${{ steps.matrix.outputs.ide-matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true

      - name: Generate IDE matrix
        id: matrix
        # language=bash
        run: |
          input_ide="${{ github.event.inputs.ide }}"
          if [[ -n "$input_ide" ]] && [[ "$input_ide" != "all" ]]; then
            json=$(echo "[\"$input_ide\"]" | jq -c .)
          else
            # One task per IDE registered in ide-integration-tests/build.gradle.kts. The grep drops
            # the build scan line Develocity prints on the same stream.
            json=$(./gradlew -q :ide-integration-tests:listIdeTests \
              | grep -E 'IdeTest$' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "ide-matrix=$json" >> "$GITHUB_OUTPUT"

  build-metro:
    name: Build Metro artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
          konan: true

      - name: Publish Metro to functionalTestRepo
        run: ./gradlew :gradle-plugin:installForFunctionalTest --quiet

      - name: Upload Metro artifacts
        uses: actions/upload-artifact@v7
        with:
          name: metro-repo
          path: build/functionalTestRepo
          retention-days: 1

  ide-tests:
    needs:
      - generate-matrix
      - build-metro
    name: "IDE / ${{ matrix.ide }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ide: ${{ fromJson(needs.generate-matrix.outputs.ide-matrix) }}

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          # Keep the Android SDK for AS matrix entries — AS's Gradle processor blocks on SdkSync if missing
          android: ${{ !startsWith(matrix.ide, 'androidStudio') }}
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - parallel:
          - name: Download Metro artifacts
            uses: actions/download-artifact@v8
            with:
              name: metro-repo
              path: build/functionalTestRepo

          - name: Setup Gradle
            uses: ./.github/actions/setup-gradle
            with:
              encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
              cache-read-only: true

          - name: Install xvfb
            run: |
              sudo apt-get update
              sudo apt-get install -y xvfb

      - name: Run IDE test
        # Resolving the IDE Starter classpath flakes with a ClosedFileSystemException (IO/download
        # issue), so retry once. The retry adds --stacktrace to pin down where the failure
        # originates if it recurs.
        run: |
          set +e
          run() {
            ./gradlew ":ide-integration-tests:${{ matrix.ide }}" --quiet "$@"
          }
          run
          status=$?
          if [ $status -ne 0 ]; then
            echo "::warning::IDE tests failed (exit $status); retrying once"
            sleep 15
            run --stacktrace
            status=$?
          fi
          exit $status

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ide-logs-${{ matrix.ide }}
          path: |
            ide-integration-tests/**/build/reports/**
            out/ide-tests/tests/**/log/**
            out/ide-tests/tests/**/reports/**

  ide-integration:
    if: always()
    runs-on: ubuntu-slim
    needs:
      - ide-tests
    steps:
      - name: Check
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          if ! grep -q -v -E '(failure|cancelled)' <<< "$results"; then
            echo "One or more IDE integration tests failed"
            exit 1
          fi
